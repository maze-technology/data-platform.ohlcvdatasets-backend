logging:
  level:
    root: info
    tech.maze: info
    org.hibernate.SQL: warn
    com.zaxxer.hikari.HikariConfig: warn
    com.zaxxer.hikari: warn
spring:
  main:
    banner-mode: 'off'
  datasource:
    enabled: true
    default:
      configuration:
        maximum-pool-size: 2
        minimum-idle: 2
        max-lifetime: 1800000
        idle-timeout: 30000
        connection-timeout: 20000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    enabled: false
  cloud:
    function:
      definition: ohlcvDatasetsConsumer;archiveChunkConsumer
    stream:
      bindings:
        ohlcvDatasetsConsumer-in-0:
          destination: ${OHLCVDATASETS_SYNC_REQUEST_TOPIC:ohlcvdatasets.sync.request}
          group: ohlcvdatasets
        archiveChunkConsumer-in-0:
          destination: ${OHLCVDATASETS_ARCHIVE_CHUNK_TOPIC:ohlcvdatasets.archive.chunk}
          group: ohlcvdatasets
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}

maze:
  events:
    enabled: true
    source: urn:service:ohlcvdatasets
  storage:
    ohlcvdatasets:
      enabled: false
  sync:
    ohlcvs-fetch-request-topic: ${OHLCVS_FETCH_REQUEST_TOPIC:ohlcvs.fetch.request}
    archive-markets: []
